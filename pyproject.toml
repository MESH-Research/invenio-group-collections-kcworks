[build-system]
build-backend = "setuptools.build_meta"
requires = ["babel>2.8", "setuptools>=83", "wheel"]

[project]
name = "invenio-group-collections-kcworks"
version = "1.1.0"
description = "Provides collections administered by remote social groups for the Knowledge Commons Works instance of InvenioRDM"
readme = "README.md"
keywords = ["groups", "invenio", "inveniordm", "research", "social"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pygments>=2.20.0",
  "werkzeug>=3.1.9",
  "setuptools>=83.0.0",
  "alembic",
  "click>=7",
  "docker-services-cli",
  "invenio-administration",
  "invenio-app-rdm[opensearch2]<14",
  "invenio-cli",
  "invenio-communities",
  "mako>=1.4.3",
  "opensearch-dsl",
  "psycopg2-binary",
  "standard-pkg-resources",
  "unidecode",
]
optional-dependencies.dev = [
  "bump-my-version==1.5.1",
  "check-manifest",
  "pytest>=7.3.2",
  "pytest-invenio",
  "pytest-runner",
  "requests-mock",
]
optional-dependencies.tests = [
  "mypy>=1.8",
  "pytest-cov>=6.2.1",
  "pytest-invenio>=3.3,<4",
  "pytest-isort>=4",
  "pytest-mock",
  "pytest-mypy>=0.10",
  "pytest-ruff>=0.1",
  "requests-mock",
  "ruff>=0.3",
  "selenium",
  "ty",
]
urls.Homepage = "https://github.com/MESH-Research/invenio-group-collections-kcworks"
scripts.invenio-group-collections-kcworks = "invenio_group_collections_kcworks.cli:cli"
entry-points."invenio_access.actions".group_collections_write_action = "invenio_group_collections_kcworks.permissions:group_collections_write_action"
entry-points."invenio_base.api_apps".invenio_group_collections_kcworks = "invenio_group_collections_kcworks.ext:InvenioGroupCollections"
entry-points."invenio_base.api_blueprints".invenio_group_collections_kcworks = "invenio_group_collections_kcworks.views:create_api_blueprint"
entry-points."invenio_base.api_finalize_app".invenio_group_collections_kcworks = "invenio_group_collections_kcworks.ext:api_finalize_app"
entry-points."invenio_base.apps".invenio_group_collections_kcworks = "invenio_group_collections_kcworks.ext:InvenioGroupCollections"
entry-points."invenio_base.finalize_app".invenio_group_collections_kcworks = "invenio_group_collections_kcworks.ext:finalize_app"
entry-points."invenio_oauth2server.scopes".group_collections_read = "invenio_group_collections_kcworks.scopes:group_collections_read_scope"
entry-points."invenio_oauth2server.scopes".group_collections_write = "invenio_group_collections_kcworks.scopes:group_collections_write_scope"

[tool.uv]
sources.invenio-communities = { path = "../invenio-communities/", editable = true }
sources.invenio-rdm-records = { path = "../invenio-rdm-records", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  "**/*.ipynb", # Exclude Jupyter notebook files
  "app_data",
  "docs",
  "node_modules",
  "scripts",
  "tests/helpers",
]
# temporarily removed C for complexity checks
lint.select = ["B", "D", "DOC", "E", "F", "I", "UP"]
# Now Ruff handles formatting, so enable formatting rules
lint.ignore = [
  "D412", # Missing blank line before closing docstring
  # Keep some warnings disabled
  "W1", # Indentation warnings
  "W2", # Whitespace warnings
  "W3", # Blank line warnings
]
lint.per-file-ignores."__init__.py" = ["D104", "E402", "F401"]
# Ensure consistent import sorting - explicitly declare tests as first-party
lint.isort.known-first-party = ["invenio_group_collections_kcworks", "tests"]
lint.pydocstyle.convention = "google"
lint.preview = true

[tool.isort]
profile = "black"
line_length = 88
verbose = true
multi_line_output = 3 # Vertical hanging indent
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
skip = [
  "__pycache__", # Skip cache directories
  # ".venv",  # Skip virtual environment
  # "node_modules",  # Skip node modules
]

[tool.check-manifest]
ignore = [
  "PKG-INFO",
  ".egg-info",
  ".egg-info/*",
  "setup.cfg",
  ".DS_Store",
  ".hgtags",
  ".hgsigs",
  ".hgignore",
  ".gitignore",
  ".bzrignore",
  ".gitattributes",
  ".github/*",
  ".travis.yml",
  "Jenkinsfile",
  "* .mo",
  "dist/*",
  "build/*",
  "invenio_group_collections_kcworks/dependencies/*",
  "*.gitkeep",
]

[tool.ty]
analysis = {}
# Type checking with ty (replaces mypy). Mirrors the parent KCWorks
# project's [tool.ty] settings; paths adapted to this submodule's layout.
environment.python-version = "3.12"
# Rule severities (ty uses rule names; mypy options translated below)
# warn_redundant_casts = true
rules.redundant-cast = "warn"
# warn_unused_ignores = false → don't warn about unused type: ignore
rules.unused-ignore-comment = "ignore"
rules.unused-type-ignore-comment = "ignore"
# ignore_missing_imports = true → suppress import-not-found
rules.import-not-found = "ignore"
# allow_untyped_globals = true → don't error on undeclared globals
rules.unresolved-global = "ignore"
# Don't type-check tests.
src.exclude = ["tests"]

[tool.pytest]
ini_options.python_files = ["test_*.py", "*_integration.py", "integration.py"]
ini_options.addopts = """
--ruff --doctest-modules
--ignore=docs
--ignore=node_modules
--ignore=scripts
--ignore=tests/helpers
--ignore=tests/fixtures
--cov=invenio_group_collections_kcworks
--cov-report=term-missing
"""
ini_options.norecursedirs = []
ini_options.log_cli = true
ini_options.log_cli_level = "DEBUG"
ini_options.isort_show_files = true
ini_options.plugins = [
  "celery.contrib.pytest",
  "tests.fixtures.app",
  "tests.fixtures.app_config",
  "tests.fixtures.bootstrap",
  "tests.fixtures.celery",
  "tests.fixtures.cli",
  "tests.fixtures.communities",
  "tests.fixtures.community_events",
  "tests.fixtures.custom_fields",
  "tests.fixtures.files",
  "tests.fixtures.fixtures",
  "tests.fixtures.frontend",
  "tests.fixtures.identifiers",
  "tests.fixtures.idms",
  "tests.fixtures.indexer_queues",
  "tests.fixtures.logging",
  "tests.fixtures.mail",
  "tests.fixtures.names",
  "tests.fixtures.records",
  "tests.fixtures.roles",
  "tests.fixtures.search",
  "tests.fixtures.search_provisioning",
  "tests.fixtures.uow",
  "tests.fixtures.users",
  "tests.fixtures.vocabularies.affiliations",
  "tests.fixtures.vocabularies.community_types",
  "tests.fixtures.vocabularies.date_types",
  "tests.fixtures.vocabularies.descriptions",
  "tests.fixtures.vocabularies.funding_and_awards",
  "tests.fixtures.vocabularies.languages",
  "tests.fixtures.vocabularies.licenses",
  "tests.fixtures.vocabularies.resource_types",
  "tests.fixtures.vocabularies.roles",
  "tests.fixtures.vocabularies.subjects",
  "tests.fixtures.vocabularies.title_types",
  "tests.pytest_plugins.pytest_live_status",
]
ini_options.testpaths = ["tests", "invenio_group_collections_kcworks"]

[tool.coverage]
run.omit = []

[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_shell_hooks = false
message = "Bump version: {current_version} → {new_version}"

# pyproject.toml project.version and tool.bumpversion.current_version are
# updated automatically by bump-my-version's update_config_file; listing them
# here double-applies a whole-file search and fails on the second entry.
[[tool.bumpversion.files]]
filename = "README.md"
search = "Version {current_version}"
replace = "Version {new_version}"

[[tool.bumpversion.files]]
filename = "VERSION"
search = '"{current_version}"'
replace = '"{new_version}"'

[[tool.bumpversion.files]]
filename = "invenio_group_collections_kcworks/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.bdist_wheel]
universal = 1

[tool.babel]
compile_catalog.directory = "translations/"
compile_catalog.use-fuzzy = true
extract_messages.copyright_holder = "Mesh Research"
extract_messages.msgid_bugs_address = "scottia4@msu.edu"
extract_messages.mapping-file = "translations/babel.ini"
extract_messages.output-file = "translations/messages.pot"
extract_messages.add-comments = "NOTE"
init_catalog.input-file = "translations/messages.pot"
init_catalog.output-dir = "translations/"
update_catalog.input-file = "translations/messages.pot"
update_catalog.output-dir = "translations/"

[tool.pylsp]
plugins.jedi.extra_paths = [
  "../../..",               # kcworks (site/)
  "../invenio-communities",
  "../invenio-rdm-records",
]
